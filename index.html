<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atrapar Limones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="limones.css" />
  <script src="utils.js" ></script>
</head>
<body onload="iniciar();">
  <div class="contenedor">
    <div class="cabecera">
      <img class="portada" src="images.jpg" alt="Ilustración de un personaje con capucha frente a una laptop" />
      <div class="info">
        <h2>Autor: Jair David Nieto</h2>
        <ul class="datos">
          <li><strong>Rol:</strong> Desarrollador y diseñador</li>
          <li><strong>Proyecto:</strong> Videojuego con HTML, CSS y JavaScript</li>
          <li><strong>Institución:</strong> KRAKEDEV</li>
          <li><strong>Correo:</strong> <a href="mailto:tucorreo@ejemplo.com">davidnieto1125@gmail.com</a></li>
          <li><strong>Año:</strong> 2026</li>
        </ul>
      </div>
    </div>
    <h1>Atrapar Limones</h1>
    <p>Si del cielo te caen limones ..... </p>
    <canvas id="areajuego" width="600" height="400" ></canvas>
    <div class="panel">
      <p>Puntaje: <span id="txtPuntaje">0</span></p>
      <p>Vidas: <span id="txtVida">3</span></p>

    </div>
    <div class="botones">
      <button type="button" onclick="moverIzquierda();" aria-label="Mover a la izquierda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span>Izquierda</span>
      </button>
      <button type="button" onclick="moverDerecha();" aria-label="Mover a la derecha">
        <span>Derecha</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button type="button" onclick="reiniciar();" aria-label="Reiniciar el juego">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        <span>Reiniciar</span>
      </button>
      <button type="button" onclick="desaparecerPersonaje();" aria-label="Reiniciar el juego">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        <span>desaparecer Personaje</span>
      </button>
    </div>
  </div>
<script src="limones.js" ></script>
